<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg?v=2" type="image/svg+xml">
  <title>City</title>
  <link rel="preload" as="video" href="pics/entry-transition.mp4" type="video/mp4">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent-rgb: 125 240 255;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    .frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--bg);
    }

    .spot-overlay {
      position: fixed;
      inset: 0;
      z-index: 0.5;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x, 50%) var(--spot-y, 45%),
          rgb(var(--accent-rgb) / 0.18),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    body.spot-on .spot-overlay {
      opacity: 1;
    }

    .chrome {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }
    /* A scene can ask for less chrome: no music button (it plays its own sound),
       or none at all while it shows something full-screen (see city:chrome). */
    .chrome { transition: opacity 0.25s, visibility 0.25s; }
    body.chrome-immersive .chrome { opacity: 0; visibility: hidden; }
    body.chrome-immersive .spot-overlay { display: none; }
    body.chrome-no-music #music-menu { display: none; }

    .chrome .controls {
      display: flex;
      gap: 0.35rem;
      align-items: center;
      padding: 0.3rem 0.4rem;
      border: 1px solid rgb(var(--accent-rgb) / 0.25);
      border-radius: 12px;
      background: rgb(6 12 18 / 0.35);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 0 20px rgb(var(--accent-rgb) / 0.06),
        inset 0 1px 0 rgb(255 255 255 / 0.04);
    }
    .chrome .controls a,
    .chrome .controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgb(255 255 255 / 0.03);
      font-size: 1.25rem;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
      font-family: inherit;
    }
    .chrome .controls a {
      color: var(--text-muted);
    }
    .chrome .controls button {
      color: var(--text-muted);
    }
    .chrome .controls a:hover,
    .chrome .controls button:hover {
      background: rgb(var(--accent-rgb) / 0.08);
      border-color: rgb(var(--accent-rgb) / 0.4);
      box-shadow: 0 0 12px rgb(var(--accent-rgb) / 0.15);
    }
    .chrome .controls a:focus-visible,
    .chrome .controls button:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.5);
      outline-offset: 2px;
    }
    .chrome .controls button.spot-on,
    .chrome .controls button.music-on,
    .chrome .controls .music-menu summary.music-on {
      background: rgb(var(--accent-rgb) / 0.12);
      border-color: rgb(var(--accent-rgb) / 0.45);
      box-shadow: 0 0 14px rgb(var(--accent-rgb) / 0.2);
    }

    .chrome .controls .links {
      display: flex;
      align-items: center;
      position: relative;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      max-width: none;
    }
    .chrome .controls .links summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgb(255 255 255 / 0.03);
      font-size: 1.25rem;
      line-height: 1;
      color: var(--text-muted);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .chrome .controls .links summary::-webkit-details-marker,
    .chrome .controls .links summary::marker { display: none; }
    .chrome .controls .links summary::before {
      content: "🗺️";
      font-size: 1.1rem;
    }
    .chrome .controls .links summary:hover {
      background: rgb(var(--accent-rgb) / 0.08);
      border-color: rgb(var(--accent-rgb) / 0.4);
      box-shadow: 0 0 12px rgb(var(--accent-rgb) / 0.15);
    }
    .chrome .controls .links summary:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.5);
      outline-offset: 2px;
    }
    .chrome .controls .links[open] summary {
      background: rgb(var(--accent-rgb) / 0.12);
      border-color: rgb(var(--accent-rgb) / 0.45);
      box-shadow: 0 0 14px rgb(var(--accent-rgb) / 0.2);
    }
    .chrome .controls .links .links-dropdown {
      position: absolute;
      bottom: 100%;
      right: 0;
      margin: 0 0 0.35rem 0;
      padding: 0.4rem 0.6rem;
      border-radius: 12px;
      background: rgb(6 14 22 / 0.96);
      border: 1px solid rgb(var(--accent-rgb) / 0.2);
      box-shadow: 0 0 20px rgb(var(--accent-rgb) / 0.08);
      min-width: 14rem;
      max-width: 34rem;
      max-height: 60vh;
      overflow: auto;
    }
    .chrome .controls .links .links-dropdown p {
      color: var(--text-muted);
      font-size: 0.82rem;
      margin: 0 0 0.25rem 0;
    }
    .chrome .controls .links .links-dropdown ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.35rem;
    }
    .chrome .controls .links a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .chrome .controls .links a:hover {
      color: rgb(var(--accent-rgb));
      border-bottom-color: rgb(var(--accent-rgb) / 0.55);
    }
    .chrome .controls .links a:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 2px;
      border-bottom-color: transparent;
    }

    .chrome .controls .music-menu {
      position: relative;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
    }
    .chrome .controls .music-menu summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2.5rem;
      min-height: 2.5rem;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 10px;
      background: rgb(255 255 255 / 0.03);
      font-size: 1.25rem;
      line-height: 1;
      color: var(--text-muted);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    /* Music started by itself on the first click: the button glows a few times, so people see where it is. */
    .chrome .controls .music-menu summary.music-hello { animation: music-hello 1.1s ease-in-out 3; }
    @keyframes music-hello {
      50% { border-color: rgb(var(--accent-rgb) / 0.9); box-shadow: 0 0 22px rgb(var(--accent-rgb) / 0.55); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chrome .controls .music-menu summary.music-hello { animation: none; }
    }
    .chrome .controls .music-menu .music-icon {
      display: inline-block;
      position: relative;
    }
    .chrome .controls .music-menu .music-icon.muted::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140%;
      height: 2px;
      margin: -1px 0 0 -70%;
      background: currentColor;
      opacity: 0.85;
      transform: rotate(-45deg);
      pointer-events: none;
    }
    .chrome .controls .music-menu summary::-webkit-details-marker,
    .chrome .controls .music-menu summary::marker { display: none; }
    .chrome .controls .music-menu summary:hover {
      background: rgb(var(--accent-rgb) / 0.08);
      border-color: rgb(var(--accent-rgb) / 0.4);
      box-shadow: 0 0 12px rgb(var(--accent-rgb) / 0.15);
    }
    .chrome .controls .music-menu summary:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.5);
      outline-offset: 2px;
    }
    .chrome .controls .music-menu[open] summary {
      background: rgb(var(--accent-rgb) / 0.12);
      border-color: rgb(var(--accent-rgb) / 0.45);
      box-shadow: 0 0 14px rgb(var(--accent-rgb) / 0.2);
    }
    .chrome .controls .music-menu .music-dropdown {
      position: absolute;
      bottom: 100%;
      right: 0;
      margin: 0 0 0.35rem 0;
      padding: 0.5rem 0.6rem;
      border-radius: 12px;
      background: rgb(6 14 22 / 0.96);
      border: 1px solid rgb(var(--accent-rgb) / 0.2);
      box-shadow: 0 0 20px rgb(var(--accent-rgb) / 0.08);
      min-width: 12rem;
      max-width: 20rem;
    }
    .chrome .controls .music-menu .music-dropdown .music-actions {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .chrome .controls .music-menu .music-dropdown .music-actions button {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
    }
    .chrome .controls .music-menu .music-dropdown p {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin: 0 0 0.35rem 0;
    }
    .chrome .controls .music-menu .music-dropdown ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 40vh;
      overflow: auto;
    }
    .chrome .controls .music-menu .music-dropdown li {
      margin: 0;
    }
    .chrome .controls .music-menu .music-dropdown li button {
      width: 100%;
      justify-content: flex-start;
      min-height: 2.2rem;
      padding: 0 0.5rem;
      font-size: 0.85rem;
      font-weight: normal;
      text-align: left;
    }
    .chrome .controls .music-menu .music-dropdown li button.active {
      background: rgb(var(--accent-rgb) / 0.15);
      border-color: rgb(var(--accent-rgb) / 0.5);
      color: var(--text);
    }

    /* Rotate-to-landscape overlay: only on narrow portrait */
    .rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2;
      background: rgb(7 11 16 / 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      .rotate-overlay { display: flex; }
    }
    @media (orientation: portrait) and (max-height: 500px) {
      .rotate-overlay { display: flex; }
    }
    .rotate-overlay .icon {
      font-size: 3rem;
      opacity: 0.9;
    }
    .rotate-overlay p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 18em;
    }

    /* Fullscreen button: show on touch-capable / small viewport */
    .chrome .controls .fullscreen-btn { display: none; }
    @media (max-width: 768px), (max-height: 500px), (pointer: coarse) {
      .chrome .controls .fullscreen-btn { display: flex; }
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .video-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .video-overlay.loading::after {
      content: "Loading…";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgb(var(--accent-rgb) / 0.28);
      background: rgb(6 12 18 / 0.55);
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      box-shadow: 0 0 18px rgb(var(--accent-rgb) / 0.08);
    }
    .video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

  </style>
  <script>
    // Arriving from Longplay's red pill (expectfun.github.io/longplay, same origin): the post ends on a screen of
    // TV static and leaves 'city-arrive' in sessionStorage, and the City picks the static up from its first frame
    // and lets it clear once the first scene has loaded. ?static shows it on any visit; STATIC_FOR_ALL would make
    // it every visitor's way in. The post also leaves a message in its own language: 'city-hint', its lines
    // separated by |, and 'city-hint-head', the header. A few seconds after the static has cleared it comes in
    // on the City's HUD, typed like the messages on Neo's monitor, and stays until the reader leaves the first scene.
    (function () {
      var STATIC_FOR_ALL = false;
      var arrive = { static: false, hint: '', head: '' };
      try {
        arrive.static = sessionStorage.getItem('city-arrive') === 'static';
        arrive.hint = sessionStorage.getItem('city-hint') || '';
        arrive.head = sessionStorage.getItem('city-hint-head') || '';
        ['city-arrive', 'city-hint', 'city-hint-head'].forEach(function (k) { sessionStorage.removeItem(k); });
      } catch (_) {}
      if (/[?&]static(=|&|$)/.test(location.search)) arrive.static = true;
      if (STATIC_FOR_ALL) arrive.static = true;
      arrive.still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (arrive.still) arrive.static = false;   // and the hint just appears, untyped
      if (arrive.static) document.documentElement.classList.add('tune-in');
      window.CITY_ARRIVE = arrive;
    })();
  </script>
  <style>
    html.tune-in { background: #7a7a7a; }   /* grey even before the first noise is drawn */
    .arrive-static { display: none; }
    html.tune-in .arrive-static {
      display: block; position: fixed; inset: 0; z-index: 10000; width: 100%; height: 100%;
      pointer-events: none; image-rendering: pixelated; transition: opacity 2s ease-in;
    }
    /* the message: a panel of the City's HUD, the same glass as the controls below, top left over the sky and
       clear of the gateway. The frame is the City's own; the green text inside is someone else's signal. As wide
       as the longest line from the start (set by the script), so the typing never reflows the panel. */
    .arrive-hint {
      position: fixed; top: 10vh; left: 6vw; z-index: 9999; box-sizing: content-box; max-width: calc(88vw - 40px);
      margin: 0; padding: 12px 20px 16px; pointer-events: none;
      border: 1px solid rgb(var(--accent-rgb) / 0.28); border-radius: 12px; background: rgb(6 12 18 / 0.55);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 0 24px rgb(var(--accent-rgb) / 0.08), inset 0 1px 0 rgb(255 255 255 / 0.04);
      transition: opacity .6s ease;
      animation: hint-online .5s steps(1) both;   /* a HUD element coming online */
    }
    @keyframes hint-online { 0% { opacity: 0; } 15% { opacity: .7; } 30% { opacity: .1; } 50% { opacity: 1; } 65% { opacity: .45; } 80%, 100% { opacity: 1; } }
    .arrive-hint .head {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
      font: 600 11px/1.4 "SF Pro Text", -apple-system, system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase;
      color: rgb(var(--accent-rgb) / 0.72);
    }
    .arrive-hint .dot { width: 7px; height: 7px; border-radius: 50%; background: #4dff88; box-shadow: 0 0 8px #4dff88;
      animation: hint-pulse 1.6s ease-in-out infinite; }
    @keyframes hint-pulse { 50% { opacity: .3; } }
    .arrive-hint .line {
      min-height: 1.45em; white-space: pre-wrap;
      font: clamp(20px, 2.6vw, 32px)/1.45 "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
      color: #4dff88; text-shadow: 0 0 10px rgb(77 255 136 / 0.6);
    }
    .arrive-hint .cursor { display: inline-block; width: .6em; height: 1.1em; margin-left: 2px; vertical-align: -.18em;
      background: currentColor; box-shadow: 0 0 8px rgb(77 255 136 / 0.6); animation: hint-blink 1s steps(1) infinite; }
    @keyframes hint-blink { 50% { opacity: 0; } }
    .arrive-hint.gone { opacity: 0; }
    /* the last line is in: the cursor blinks a few more times, then goes, and nothing more is coming */
    .arrive-hint.over .cursor { animation: hint-blink 1s steps(1) 3, hint-out .6s ease 3s forwards; }
    @keyframes hint-out { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .arrive-hint { animation: none; }
      .arrive-hint .dot { animation: none; }
      .arrive-hint .cursor { display: none; }
    }
  </style>
</head>
<body>
  <canvas class="arrive-static" id="arrive-static" aria-hidden="true"></canvas>
  <script>
    (function () {
      var arrive = window.CITY_ARRIVE, canvas = document.getElementById('arrive-static');
      if (!arrive.static) canvas.remove();
      if (!arrive.static && !arrive.hint) return;

      // the first scene in: now, or when the frame says so
      function firstScene(cb) {
        window.addEventListener('DOMContentLoaded', function () {
          var frame = document.getElementById('city-frame');
          if (!frame) return cb();
          var loaded = false;
          try { loaded = frame.contentDocument.readyState === 'complete' && frame.contentDocument.URL !== 'about:blank'; } catch (_) {}
          if (loaded) cb();
          else frame.addEventListener('load', function () { cb(); }, { once: true });
        });
      }

      if (!arrive.static) {   // reduced motion: no static, the hint a moment after the scene is in
        firstScene(function () { setTimeout(hint, 1500); });
        return;
      }
      var ctx = canvas.getContext('2d');
      var w = canvas.width = Math.ceil(innerWidth / 3), h = canvas.height = Math.ceil(innerHeight / 3);
      var img = ctx.createImageData(w, h), px = new Uint32Array(img.data.buffer), done = false;
      (function draw() {
        if (done) return;
        for (var i = 0; i < px.length; i++) { var v = Math.random() * 200 + 30 | 0; px[i] = 0xff000000 | v << 16 | v << 8 | v; }
        ctx.putImageData(img, 0, 0);
        requestAnimationFrame(draw);
      })();
      // the picture comes through: once the first scene has loaded (or after a while, whatever happens),
      // the static thins out over two seconds and is gone; a few seconds of the City alone, then the hint
      function clear() {
        if (canvas.style.opacity) return;
        canvas.style.opacity = '0';
        setTimeout(function () {
          done = true; canvas.remove(); document.documentElement.classList.remove('tune-in');
          setTimeout(hint, 3000);
        }, 2100);
      }
      firstScene(function () { setTimeout(clear, 350); });
      setTimeout(clear, 6000);

      // the panel flickers on; then each line is typed a key at a time, unevenly, under a blinking block cursor,
      // a pause between lines, and they all stay
      function hint() {
        if (!arrive.hint) return;
        var box = document.createElement('div'), cursor = document.createElement('span');
        box.className = 'arrive-hint';
        box.setAttribute('role', 'status');
        if (arrive.head) {
          var head = document.createElement('p'), dot = document.createElement('span');
          head.className = 'head';
          dot.className = 'dot';
          head.append(dot, document.createTextNode(arrive.head));
          box.append(head);
        }
        cursor.className = 'cursor';
        cursor.setAttribute('aria-hidden', 'true');
        var lines = arrive.hint.split('|').map(function (t) {
          var el = document.createElement('div');
          el.className = 'line';
          box.append(el);
          return { el: el, chars: Array.from(t) };
        });
        var longest = Math.max.apply(null, lines.map(function (l) { return l.chars.length; }));
        box.style.width = 'calc(' + (longest + 1) + 'ch + 4px)';
        box.style.fontFamily = '"JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace';   // so ch is the lines' ch
        box.style.fontSize = 'clamp(20px, 2.6vw, 32px)';
        document.body.append(box);
        var l = 0, i = 0, timer;
        if (arrive.still) {
          lines.forEach(function (line) { line.el.textContent = line.chars.join(''); });
          box.classList.add('over');
        } else {
          lines.forEach(function (line, n) { if (n) line.el.style.display = 'none'; });
          lines[0].el.append(cursor);
          timer = setTimeout(function type() {
            var line = lines[l];
            if (i < line.chars.length) {
              cursor.before(line.chars[i++]);
              timer = setTimeout(type, 55 + Math.random() * 110);
            } else if (l < lines.length - 1) {
              timer = setTimeout(function () {
                l++; i = 0;
                lines[l].el.style.display = '';
                lines[l].el.append(cursor);
                timer = setTimeout(type, 400);
              }, 1100);
            } else box.classList.add('over');
          }, 700);
        }
        // gone once the reader leaves the first scene: as its transition video starts, or as another scene loads
        function gone() {
          if (box.classList.contains('gone')) return;
          clearTimeout(timer);
          box.classList.add('gone');
          setTimeout(function () { box.remove(); }, 700);
        }
        var frame = document.getElementById('city-frame');
        if (frame) frame.addEventListener('load', gone, { once: true });
        window.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'city:transition') gone();
        });
      }
    })();
  </script>
  <div class="rotate-overlay" id="rotate-overlay" aria-hidden="true" role="presentation">
    <span class="icon" aria-hidden="true">📱↻</span>
    <p>Rotate your device to landscape for a better view.</p>
  </div>
  <div class="chrome" role="region" aria-label="City navigation">
    <div class="controls" role="group" aria-label="City controls">
      <button type="button" id="fullscreen-toggle" class="fullscreen-btn" aria-label="Fullscreen" title="Fullscreen">⛶</button>
      <button type="button" id="spot-toggle" aria-pressed="false" aria-label="Toggle flashlight" title="Flashlight">🔦</button>
      <details class="music-menu" id="music-menu">
        <summary id="music-toggle" aria-label="Music" title="Music"><span class="music-icon" aria-hidden="true">🎵</span></summary>
        <div class="music-dropdown">
          <div class="music-actions">
            <button type="button" id="music-play-pause" aria-label="Play / Pause">▶ Play</button>
            <button type="button" id="music-stop" aria-label="Stop">⏹ Stop</button>
          </div>
          <p id="music-playlist-desc">Rain Alley is generated live · the rest are by Moby</p>
          <ul id="music-playlist"></ul>
        </div>
      </details>
      <details class="links" id="shell-links">
        <summary aria-label="Doors / Scene links"></summary>
        <div class="links-dropdown">
          <p id="shell-links-desc">Doors and signs in this scene.</p>
          <ul id="shell-links-list"></ul>
        </div>
      </details>
    </div>
  </div>
  <iframe class="frame" id="city-frame" src="places/entry.html" title="City"></iframe>
  <div class="spot-overlay" id="spot-overlay" aria-hidden="true"></div>
  <div class="video-overlay" id="video-overlay" aria-hidden="true">
    <video id="transition-video" preload="auto" muted playsinline src="pics/entry-transition.mp4"></video>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/live-music.js"></script>
  <script src="js/nav-data.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      root.dataset.theme = 'dark';

      var frame = document.getElementById('city-frame');
      if (!frame) return;

      var currentSceneFile = 'entry.html';
      var dynamicLinks = Object.create(null);
      var FALLBACK_LINKS = (window.CITY_NAV && window.CITY_NAV.doors) ? window.CITY_NAV.doors : Object.create(null);

      function normalizeScenePath(path) {
        if (!path) return path;
        if (/^(https?:|data:|blob:|javascript:)/i.test(path)) return '';
        while (path.indexOf('../') === 0) path = path.slice(3);
        if (path.indexOf('..') !== -1) return '';
        if (path.indexOf('/') !== -1) {
          if (path.indexOf('places/') === 0 || path.indexOf('tools/') === 0 || path.indexOf('posts/') === 0) return path;
          return '';
        }
        var bare = /^([a-z0-9_-]+)(\?.*)?$/i.exec(path);
        if (bare && FALLBACK_LINKS[bare[1] + '.html']) path = bare[1] + '.html' + (bare[2] || '');
        if (!/\.html($|\?)/i.test(path)) return '';
        if (path === 'index.html') return path;
        return 'places/' + path;
      }

      function setScene(path) {
        var normalized = normalizeScenePath(path);
        if (!normalized) return;
        currentSceneFile = normalized.split('?')[0].split('/').pop() || normalized;
        updateDoorsList(currentSceneFile);
        frame.src = normalized;
      }

      var params = new URLSearchParams(window.location.search);
      var requested = params.get('scene') || params.get('s') || '';
      if (requested) setScene(requested);
      if (window.location.hash && window.location.hash.length > 1) {
        setScene(window.location.hash.slice(1));
      }

      function addLinkToList(list, item) {
        var li = document.createElement('li');
        var newA = document.createElement('a');
        var href = item.href || '';
        newA.textContent = item.text || href;
        newA.setAttribute('href', href);
        if (item.external || /^https?:/i.test(href)) {
          newA.setAttribute('target', '_blank');
          newA.setAttribute('rel', 'noopener');
        } else {
          newA.addEventListener('click', function (e) {
            var targetHref = this.getAttribute('href');
            if (targetHref && !/^https?:/i.test(targetHref)) {
              e.preventDefault();
              setScene(targetHref);
            }
          });
        }
        li.appendChild(newA);
        list.appendChild(li);
      }

      function updateDoorsList(file) {
        var list = document.getElementById('shell-links-list');
        if (!list) return;
        list.innerHTML = '';
        var items = dynamicLinks[file] && dynamicLinks[file].length ? dynamicLinks[file] : FALLBACK_LINKS[file];
        if (items) {
          for (var i = 0; i < items.length; i++) addLinkToList(list, items[i]);
        }
      }

      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.data.type !== 'city:scene') return;
        var file = e.data.file;
        if (file && typeof file === 'string') {
          currentSceneFile = file.split('?')[0].split('/').pop() || file;
          updateDoorsList(currentSceneFile);
        }
      });

      // Each scene starts with the full chrome; a scene may then trim it with city:chrome.
      function setChrome(music, immersive) {
        document.body.classList.toggle('chrome-no-music', !music);
        document.body.classList.toggle('chrome-immersive', !!immersive);
        var menu = document.getElementById('music-menu');
        if (menu && (!music || immersive)) menu.open = false;
        var links = document.getElementById('shell-links');
        if (links && immersive) links.open = false;
      }
      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.source !== frame.contentWindow) return;
        if (e.data.type === 'city:scene') setChrome(true, false);
        else if (e.data.type === 'city:chrome') setChrome(e.data.music !== false, e.data.immersive);
      });

      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.data.type !== 'city:links') return;
        var file = e.data.file;
        var links = e.data.links;
        if (!file || typeof file !== 'string') return;
        if (!Array.isArray(links)) return;
        dynamicLinks[file] = links;
        if ((file.split('?')[0].split('/').pop() || file) === currentSceneFile) {
          updateDoorsList(currentSceneFile);
        }
      });

      updateDoorsList(currentSceneFile);

      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var spotKey = 'city-flashlight';
      var spotToggle = document.getElementById('spot-toggle');
      var spotOverlay = document.getElementById('spot-overlay');
      var raf = 0;
      var lastX = window.innerWidth / 2;
      var lastY = window.innerHeight / 2;

      function isSpotOn() {
        try { return localStorage.getItem(spotKey) === 'on'; } catch (e) { return false; }
      }
      function setSpotOn(on) {
        try { localStorage.setItem(spotKey, on ? 'on' : 'off'); } catch (e) {}
        document.body.classList.toggle('spot-on', on);
        if (spotToggle) {
          spotToggle.classList.toggle('spot-on', on);
          spotToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
        }
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({ type: 'city:spot-state', on: !!on }, '*');
          }
        } catch (e) {}
        if (on) {
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
          if (!reduceMotion) document.addEventListener('pointermove', onSpotPointerMove, { passive: true });
        } else {
          document.removeEventListener('pointermove', onSpotPointerMove);
        }
      }
      function onSpotPointerMove(e) {
        if (e.pointerType === 'touch') return;
        lastX = e.clientX;
        lastY = e.clientY;
        if (raf) return;
        raf = window.requestAnimationFrame(function () {
          raf = 0;
          root.style.setProperty('--spot-x', lastX + 'px');
          root.style.setProperty('--spot-y', lastY + 'px');
        });
      }
      function setSpotPosition(x, y) {
        lastX = x;
        lastY = y;
        root.style.setProperty('--spot-x', lastX + 'px');
        root.style.setProperty('--spot-y', lastY + 'px');
      }

      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.data.type !== 'city-spot-move') return;
        var x = e.data.x;
        var y = e.data.y;
        if (typeof x !== 'number' || typeof y !== 'number') return;
        if (!document.body.classList.contains('spot-on')) return;
        setSpotPosition(x, y);
      }, { passive: true });

      if (spotToggle) {
        spotToggle.addEventListener('click', function () {
          setSpotOn(!isSpotOn());
        });
      }
      if (isSpotOn()) {
        setSpotOn(true);
      }

      var musicMenu = document.getElementById('music-menu');
      var musicToggle = document.getElementById('music-toggle');
      var musicPlayPause = document.getElementById('music-play-pause');
      var musicStop = document.getElementById('music-stop');
      var musicPlaylist = document.getElementById('music-playlist');
      if (musicMenu && musicToggle) {
        function updateMusicSummary() {
          var api = window.__CITY_AUDIO_API__;
          var on = api && api.getEnabled && api.getEnabled();
          musicToggle.classList.toggle('music-on', !!on);
          musicToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
          var icon = musicToggle.querySelector('.music-icon');
          if (icon) icon.classList.toggle('muted', !on);
          var name = api && api.getTrackName ? api.getTrackName() : '';
          musicToggle.title = name ? 'Music — ' + name : 'Music';
        }
        function updateMusicDropdown() {
          var api = window.__CITY_AUDIO_API__;
          if (!api) return;
          var enabled = api.getEnabled && api.getEnabled();
          var paused = api.isPaused && api.isPaused();
          var idx = api.getTrackIndex ? api.getTrackIndex() : 0;
          if (musicPlayPause) {
            musicPlayPause.textContent = (!enabled || paused) ? '▶ Play' : '⏸ Pause';
            musicPlayPause.setAttribute('aria-label', (!enabled || paused) ? 'Play' : 'Pause');
          }
          if (musicPlaylist) {
            var items = musicPlaylist.querySelectorAll('li button');
            for (var i = 0; i < items.length; i++) {
              items[i].classList.toggle('active', enabled && !paused && i === idx);
            }
          }
        }
        function fillPlaylist() {
          if (!musicPlaylist) return;
          var api = window.__CITY_AUDIO_API__;
          var tracks = api && api.getTracks && api.getTracks();
          if (!tracks || !tracks.length) return;
          musicPlaylist.innerHTML = '';
          for (var i = 0; i < tracks.length; i++) {
            (function (index) {
              var li = document.createElement('li');
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.textContent = tracks[index].name;
              btn.setAttribute('aria-label', 'Play ' + tracks[index].name);
              btn.addEventListener('click', function () {
                if (api && api.playTrack) api.playTrack(index);
                updateMusicSummary();
                updateMusicDropdown();
              });
              li.appendChild(btn);
              musicPlaylist.appendChild(li);
            })(i);
          }
          updateMusicDropdown();
        }
        musicMenu.addEventListener('toggle', function () {
          if (musicMenu.open) {
            fillPlaylist();
            updateMusicDropdown();
          }
        });
        if (musicPlayPause) {
          musicPlayPause.addEventListener('click', function () {
            var api = window.__CITY_AUDIO_API__;
            if (!api) return;
            var enabled = api.getEnabled && api.getEnabled();
            var paused = api.isPaused && api.isPaused();
            if (!enabled || paused) {
              if (!enabled && api.setEnabled) api.setEnabled(true);
              else if (api.resume) api.resume();
            } else if (api.pause) api.pause();
            updateMusicSummary();
            updateMusicDropdown();
          });
        }
        if (musicStop) {
          musicStop.addEventListener('click', function () {
            var api = window.__CITY_AUDIO_API__;
            if (api && api.stop) api.stop();
            updateMusicSummary();
            updateMusicDropdown();
            if (musicMenu) musicMenu.open = false;
          });
        }
        if (document.readyState === 'complete') {
          updateMusicSummary();
        } else {
          document.addEventListener('DOMContentLoaded', updateMusicSummary, { once: true });
        }
        setInterval(function () { updateMusicSummary(); updateMusicDropdown(); }, 800);
        window.addEventListener('city-music-start', function (e) {
          updateMusicSummary();
          if (!e.detail || !e.detail.auto) return;
          musicToggle.classList.add('music-hello');
          setTimeout(function () { musicToggle.classList.remove('music-hello'); }, 3600);
        });
      }

      var fullscreenToggle = document.getElementById('fullscreen-toggle');
      if (fullscreenToggle) {
        function isFullscreen() {
          return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }
        function updateFullscreenButton() {
          var on = isFullscreen();
          fullscreenToggle.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
          fullscreenToggle.setAttribute('title', on ? 'Exit fullscreen' : 'Fullscreen');
          fullscreenToggle.textContent = on ? '✕' : '⛶';
        }
        function requestFullscreen() {
          var el = document.documentElement;
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }
        function exitFullscreen() {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
        fullscreenToggle.addEventListener('click', function () {
          if (isFullscreen()) exitFullscreen();
          else requestFullscreen();
        });
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        updateFullscreenButton();
      }
      var videoOverlay = document.getElementById('video-overlay');
      var transVideo = document.getElementById('transition-video');
      var transitioning = false;

      var VIDEO_TRANSITIONS = (window.CITY_NAV && window.CITY_NAV.videoTransitions)
        ? window.CITY_NAV.videoTransitions
        : Object.create(null);

      function getTransitionEntry(fromScene, toScene) {
        var entry = VIDEO_TRANSITIONS[fromScene];
        if (!entry || entry.to !== toScene) return null;
        return entry;
      }

      function ensureTransitionVideoSrc(entry) {
        if (!transVideo || !entry || !entry.src) return;
        if (transVideo.getAttribute('src') !== entry.src) {
          transVideo.setAttribute('src', entry.src);
        }
        try { transVideo.load(); } catch (e) {}
      }

      function waitForVideoReady(timeoutMs) {
        return new Promise(function (resolve) {
          if (!transVideo) return resolve(false);
          if (transVideo.readyState >= 3) return resolve(true); // HAVE_FUTURE_DATA

          var done = false;
          var timer = setTimeout(function () { finish(false); }, timeoutMs);

          function finish(ok) {
            if (done) return;
            done = true;
            clearTimeout(timer);
            transVideo.removeEventListener('loadeddata', onReady);
            transVideo.removeEventListener('canplay', onReady);
            transVideo.removeEventListener('error', onError);
            resolve(ok);
          }

          function onReady() { finish(true); }
          function onError() { finish(false); }

          transVideo.addEventListener('loadeddata', onReady);
          transVideo.addEventListener('canplay', onReady);
          transVideo.addEventListener('error', onError);
          try { transVideo.load(); } catch (e) {}
        });
      }

      function primeTransitionVideo() {
        var entry = VIDEO_TRANSITIONS[currentSceneFile];
        if (!entry || !entry.src) return;
        ensureTransitionVideoSrc(entry);
      }

      primeTransitionVideo();
      window.addEventListener('pointerdown', function onFirstPointer() {
        window.removeEventListener('pointerdown', onFirstPointer);
        if (!transVideo) return;
        try {
          transVideo.muted = true;
          transVideo.playsInline = true;
          transVideo.currentTime = 0;
          transVideo.play().then(function () {
            transVideo.pause();
            transVideo.currentTime = 0;
          }).catch(function () {});
        } catch (e) {}
      }, { passive: true });

      function playTransition(target) {
        if (transitioning) return;
        var entry = getTransitionEntry(currentSceneFile, target);
        if (!entry) { setScene(target); return; }

        transitioning = true;

        ensureTransitionVideoSrc(entry);
        var startedAt = Date.now();
        var loadingTimer = setTimeout(function () {
          if (!transitioning) return;
          // Only show "Loading…" if we're actually waiting on data.
          if (transVideo && transVideo.readyState >= 3) return;
          if (!videoOverlay.classList.contains('active')) videoOverlay.classList.add('active');
          videoOverlay.classList.add('loading');
        }, 220);

        waitForVideoReady(900).then(function (ready) {
          clearTimeout(loadingTimer);
          if (!ready) {
            // Don’t trap the user behind a black screen because a video decided to buffer.
            setScene(target);
            if (videoOverlay) {
              videoOverlay.classList.remove('active');
              videoOverlay.classList.remove('loading');
            }
            transitioning = false;
            return;
          }

          var delay = Math.max(0, 220 - (Date.now() - startedAt));
          videoOverlay.classList.add('active');
          videoOverlay.classList.remove('loading');

          setTimeout(function () {
            try { transVideo.currentTime = 0; } catch (e) {}
            transVideo.play().then(function () {
              transVideo.addEventListener('ended', function onEnd() {
                transVideo.removeEventListener('ended', onEnd);
                setScene(target);
                setTimeout(function () {
                  videoOverlay.classList.remove('active');
                  transitioning = false;
                }, 350);
              });
            }).catch(function () {
              setScene(target);
              videoOverlay.classList.remove('active');
              transitioning = false;
            });
          }, delay);
        });
      }

      window.addEventListener('message', function (e) {
        if (!e || !e.data || e.data.type !== 'city:transition') return;
        var to = e.data.to;
        if (to && typeof to === 'string') playTransition(to);
      });

      frame.addEventListener('load', function () {
        try {
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({ type: 'city:spot-state', on: isSpotOn() }, '*');
          }
        } catch (e) {}
      });

    })();
  </script>
</body>
</html>
