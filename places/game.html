<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Arcade</title>
  <link rel="stylesheet" href="../tools/brunogames/brumba-game.css">
  <script>
    (function () {
      var u = navigator.userAgent || '';
      if (/AppleWebKit/i.test(u) && !/(Chrome|Chromium|CriOS|EdgA|Edg\/)/i.test(u)) {
        document.documentElement.setAttribute('data-arcade-wk', '1');
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #070b10;
      --text: #e8eef6;
      --text-muted: rgba(232, 238, 246, 0.66);
      --border: rgba(232, 238, 246, 0.16);
      --panel: rgb(9 14 20 / 0.62);

      --accent: #7df0ff;
      --accent2: #ffc56d;
      --accent-rgb: 125 240 255;
      --accent2-rgb: 255 197 109;

      --spot-x: 70%;
      --spot-y: 10%;
      --spot-alpha: 0.18;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.30));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit {
      display: inline-block;
    }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .overlay foreignObject {
      pointer-events: all;
      overflow: visible;
    }
    .overlay foreignObject > * {
      width: 100%;
      height: 100%;
      display: block;
    }
    .arcade-screen-host {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .arcade-screen-host .screen {
      position: absolute;
      pointer-events: auto;
    }
    .screen {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 2px rgb(0 0 0 / 0.45) inset, 0 18px 55px rgb(0 0 0 / 0.45);
      pointer-events: auto;
    }
    .screen-frame {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 0;
      min-height: 0;
    }
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg,
          rgb(255 255 255 / 0.00) 0px,
          rgb(255 255 255 / 0.00) 2px,
          rgb(0 0 0 / 0.14) 3px),
        radial-gradient(600px circle at 60% 30%, rgb(255 255 255 / 0.06), transparent 60%);
      mix-blend-mode: overlay;
      opacity: 0.85;
    }

    /* WebKit: overlay blend on top of live canvas/video forces full recomposite every frame — use normal blend. */
    html[data-arcade-wk="1"] .screen {
      isolation: isolate;
    }
    html[data-arcade-wk="1"] .screen::before {
      mix-blend-mode: normal;
      opacity: 0.42;
      background:
        repeating-linear-gradient(180deg,
          transparent 0px,
          transparent 2px,
          rgb(0 0 0 / 0.22) 3px),
        radial-gradient(600px circle at 60% 30%, rgb(255 255 255 / 0.06), transparent 60%);
    }

    .jump-zone-wrapper {
      width: 100%;
      height: 100%;
      display: block;
    }
    .jump-zone {
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      display: block;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .jump-zone:hover {
      background: rgb(255 197 109 / 0.08);
    }
    .jump-zone:active {
      background: rgb(255 197 109 / 0.18);
    }

    .exit-zone {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      background: transparent;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .exit-zone:hover {
      background: rgb(125 240 255 / 0.06);
    }

  </style>
</head>
<body>
  <main class="scene">
    <img class="bg" src="../pics/arcade-cabinet.jpg" alt="Arcade cabinet with a dark screen in a neon-lit arcade room.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>

    <svg class="overlay" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="Arcade cabinet overlays">
      <rect id="arcade-screen-bounds" x="565" y="239" width="251" height="293" fill="none" pointer-events="none" aria-hidden="true"/>
      <foreignObject x="618" y="578" width="140" height="58">
        <div xmlns="http://www.w3.org/1999/xhtml" class="jump-zone-wrapper">
          <button type="button" class="jump-zone" id="arcade-jump-btn" aria-label="Jump (arcade button)"></button>
        </div>
      </foreignObject>
      <foreignObject x="930" y="100" width="250" height="500">
        <a xmlns="http://www.w3.org/1999/xhtml" class="exit-zone" href="street.html" aria-label="Exit to street"></a>
      </foreignObject>
    </svg>

    <div class="arcade-screen-host">
      <div class="screen" id="arcade-screen-slot" aria-label="Arcade cabinet screen">
        <div class="screen-frame">
          <div
            id="arcade-brumba-root"
            class="brumba-root"
            data-embedded="1"
            data-logical-scale="2"
            data-sprite="../tools/brunogames/bruno.png"
          >
            <div id="brumba-gameContainer">
              <canvas id="brumba-gameCanvas"></canvas>
              <div id="brumba-scoreHUD"></div>
              <div id="brumba-highScoreHUD"></div>
              <button type="button" id="brumba-muteButton" aria-label="Toggle sound">🔊</button>
              <button type="button" id="brumba-pauseButton" aria-label="Pause game">⏸️</button>
              <div id="brumba-ui">
                <div class="brumba-overlay" id="brumba-startScreen">
                  <h1>Bruno's Roomba Ride</h1>
                  <p class="subtitle">Bruno is cruising on his Roomba!<br>Tap to jump over chairs.<br>Stay low to pass under tables!</p>
                  <p class="tap-hint">Tap to Start</p>
                </div>
                <div class="brumba-overlay" id="brumba-gameOverScreen" style="display: none;">
                  <h1>Oops!</h1>
                  <p class="score-display"><span id="brumba-finalScore">0</span></p>
                  <p class="high-score">Best: <span id="brumba-highScoreDisplay">0</span></p>
                  <p class="tap-hint">Tap to Retry</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <script>
    (function () {
      var jumpBtn = document.getElementById('arcade-jump-btn');
      var boundsEl = document.getElementById('arcade-screen-bounds');
      var slotEl = document.getElementById('arcade-screen-slot');
      var sceneEl = document.querySelector('.scene');

      function layoutArcadeScreen() {
        if (!boundsEl || !slotEl || !sceneEl) return;
        var br = boundsEl.getBoundingClientRect();
        var sr = sceneEl.getBoundingClientRect();
        slotEl.style.left = br.left - sr.left + 'px';
        slotEl.style.top = br.top - sr.top + 'px';
        slotEl.style.width = br.width + 'px';
        slotEl.style.height = br.height + 'px';
      }

      layoutArcadeScreen();
      requestAnimationFrame(layoutArcadeScreen);
      window.addEventListener('resize', layoutArcadeScreen);
      window.addEventListener('orientationchange', layoutArcadeScreen);
      if (window.ResizeObserver && sceneEl) {
        new ResizeObserver(layoutArcadeScreen).observe(sceneEl);
      }
      var bgImg = document.querySelector('.bg');
      if (bgImg && !bgImg.complete) bgImg.addEventListener('load', layoutArcadeScreen, { once: true });

      if (!jumpBtn) return;

      jumpBtn.addEventListener('click', function () {
        window.postMessage({ type: 'arcadeJump' }, '*');
      });
    })();
  </script>
  <script src="../tools/brunogames/brumba-game.js"></script>
  <script src="../js/scene-common.js"></script>
  <script src="../js/gesture-bridge.js"></script>
</body>
</html>
