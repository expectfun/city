<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City — Office</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root, [data-theme="dark"] {
      --bg: #050b12;
      --text: #e5f1ff;
      --text-muted: rgba(188, 214, 233, 0.70);
      --border: rgba(128, 179, 205, 0.22);
      --panel: rgb(8 18 28 / 0.72);

      --accent: #54d8ff;
      --accent2: #8d78ff;
      --accent-rgb: 84 216 255;
      --accent2-rgb: 141 120 255;
      --ui-panel-rgb: 8 18 28;
      --ui-card-rgb: 10 24 36;

      --spot-x: 62%;
      --spot-y: 36%;
      --spot-alpha: 0.20;
      --hot: 84 216 255;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .scene {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.02) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1100px circle at 50% 45%, transparent 55%, rgb(0 0 0 / 0.58) 100%),
        linear-gradient(180deg, rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.32));
      pointer-events: none;
    }
    .spot {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(700px circle at var(--spot-x) var(--spot-y),
          rgb(var(--accent-rgb) / var(--spot-alpha)),
          transparent 60%);
      mix-blend-mode: screen;
      opacity: calc(0.95 * var(--spot-ready, 0));
    }
    body.in-shell .spot { opacity: 0 !important; }

    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .hotspots a { cursor: pointer; }
    .hotspots rect {
      fill: rgb(var(--hot) / 0.02);
      stroke: transparent;
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
    }
    .hotspots a:hover rect {
      fill: rgb(var(--hot) / 0.07);
      stroke: transparent;
    }
    .hotspots a:focus-visible rect {
      fill: rgb(var(--hot) / 0.10);
      stroke: rgb(var(--hot) / 0.90);
    }

    .standalone-exit {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2;
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text-muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    body:not(.in-shell) .standalone-exit { display: inline-block; }
    .standalone-exit:hover {
      color: var(--text);
      border-color: rgb(var(--accent-rgb) / 0.55);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.10);
    }
    .standalone-exit:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.45);
      outline-offset: 3px;
    }

    .os-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .os-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .os-overlay__backdrop {
      position: absolute;
      inset: 0;
      background: rgb(0 0 0 / 0.58);
      backdrop-filter: blur(6px);
    }
    .os-overlay__panel {
      position: relative;
      width: min(1280px, calc(100vw - 2rem));
      height: min(720px, calc(100vh - 2rem));
      border-radius: 18px;
      border: 1px solid rgb(var(--accent-rgb) / 0.24);
      background:
        radial-gradient(1100px circle at 72% 16%, rgb(var(--accent-rgb) / 0.12), transparent 62%),
        radial-gradient(900px circle at 18% 92%, rgb(var(--accent2-rgb) / 0.10), transparent 64%),
        rgb(var(--ui-panel-rgb) / 0.80);
      box-shadow:
        0 24px 90px rgba(0, 0, 0, 0.55),
        0 0 28px rgb(var(--accent-rgb) / 0.16),
        0 0 0 1px rgb(var(--accent-rgb) / 0.10) inset;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .os-overlay__topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgb(var(--accent-rgb) / 0.22);
      background:
        linear-gradient(90deg, rgb(var(--accent2-rgb) / 0.10), transparent 48%),
        linear-gradient(180deg, rgb(var(--ui-panel-rgb) / 0.88), rgb(var(--ui-panel-rgb) / 0.56));
    }
    .os-overlay__brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 650;
      letter-spacing: 0.2px;
      color: var(--text-muted);
    }
    .os-overlay__actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .os-overlay__close {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgb(var(--accent-rgb) / 0.22);
      background: rgb(var(--ui-panel-rgb) / 0.54);
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }
    .os-overlay__close:hover { transform: translateY(-1px); border-color: rgba(125, 240, 255, 0.4); }
    .os-overlay__close:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.35);
      outline-offset: 3px;
    }
    .os-overlay__body {
      overflow: auto;
      scrollbar-gutter: stable both-edges;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .os-overlay__footer {
      border-top: 1px solid rgb(var(--accent-rgb) / 0.18);
      background:
        linear-gradient(180deg, rgb(var(--ui-panel-rgb) / 0.42), rgb(var(--ui-panel-rgb) / 0.74));
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: center;
    }
    .os-overlay__footer .row { justify-content: center; }

    .app { display: block; width: 100%; max-width: 600px; }
    .decompose {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
      gap: 0.85rem;
    }
    .decompose__title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 680;
      letter-spacing: 0.2px;
    }
    .decompose__view {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      padding-top: 0.25rem;
    }
    .decompose__card {
      width: 100%;
      min-width: min(600px, 100%);
      border-radius: 16px;
      border: 1px solid rgb(var(--accent-rgb) / 0.20);
      background:
        linear-gradient(180deg, rgb(var(--ui-card-rgb) / 0.52), rgb(var(--ui-card-rgb) / 0.34));
      padding: 0.85rem;
    }
    .decompose__prompt {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 620;
      letter-spacing: 0.1px;
    }
    .decompose__task {
      margin: 0.35rem 0 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .decompose__task--focus {
      font-size: 1.2rem;
      line-height: 1.35;
      color: var(--text);
      margin-top: 0.5rem;
    }
    .decompose__timer {
      font-variant-numeric: tabular-nums;
      font-size: 2.1rem;
      font-weight: 720;
      letter-spacing: 0.5px;
      margin: 0.2rem 0 0;
    }
    .decompose__lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      text-align: left;
      width: 100%;
    }
    @media (max-width: 820px) { .decompose__lists { grid-template-columns: 1fr; } }
    .decompose__h {
      margin: 0 0 0.45rem;
      font-size: 0.92rem;
      font-weight: 650;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .decompose__ul { margin: 0; padding: 0 0 0 1.1rem; color: rgba(232, 238, 246, 0.88); }
    .decompose__ul li { margin: 0.25rem 0; }
    .decompose__meta { color: var(--text-muted); font-size: 0.92rem; margin: 0.35rem 0 0; }

    .field__textarea {
      width: 100%;
      min-width: min(560px, 100%);
      resize: vertical;
      min-height: 6.5rem;
      border-radius: 14px;
      border: 1px solid rgb(var(--accent-rgb) / 0.22);
      background: rgb(var(--ui-panel-rgb) / 0.50);
      color: var(--text);
      padding: 0.75rem 0.85rem;
      outline: none;
      font-family: inherit;
      line-height: 1.35;
    }
    .field__time {
      width: 7.5rem;
      border-radius: 12px;
      border: 1px solid rgb(var(--accent-rgb) / 0.22);
      background: rgb(var(--ui-panel-rgb) / 0.50);
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font-size: 0.96rem;
      text-align: center;
      outline: none;
    }
    .field__time:focus-visible {
      outline: 2px solid rgb(var(--accent-rgb) / 0.35);
      outline-offset: 2px;
    }

    .row { display: flex; gap: 0.55rem; align-items: center; flex-wrap: wrap; }
    .btn {
      border-radius: 12px;
      border: 1px solid rgb(var(--accent-rgb) / 0.20);
      background: rgb(var(--ui-panel-rgb) / 0.38);
      color: var(--text);
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.12s ease;
      font-weight: 600;
      min-height: 44px;
      letter-spacing: 0.01em;
    }
    .btn:hover { border-color: rgb(var(--accent-rgb) / 0.58); background: rgb(var(--accent-rgb) / 0.10); transform: translateY(-1px); }
    .btn:focus-visible { outline: 2px solid rgb(var(--accent-rgb) / 0.35); outline-offset: 3px; }
    .btn--primary { border-color: rgb(var(--accent-rgb) / 0.46); background: linear-gradient(180deg, rgb(var(--accent-rgb) / 0.16), rgb(var(--accent-rgb) / 0.08)); }
    .btn--ghost { background: transparent; border-color: rgb(var(--accent2-rgb) / 0.24); color: var(--text-muted); }
    .btn--small { padding: 0.60rem 0.75rem; font-size: 0.92rem; min-height: 40px; }
    .time-error { color: #ff9ebf; font-size: 0.85rem; min-height: 1.1rem; margin: 0.2rem 0 0; }
    .time-help { color: var(--text-muted); font-size: 0.86rem; margin: 0.2rem 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .bg { transform: none; }
    }
  </style>
  <!-- walking between scenes: the browser crossfades the two pages; the late picture fades in (js/gesture-bridge.js) -->
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.4s; } img.bg.arriving { opacity: 0; } img.bg.arrived { transition: opacity 0.5s; } }</style>
</head>
<body>
  <script>if (window.self !== window.top) document.body.classList.add('in-shell');</script>
  <main class="scene">
    <img class="bg" src="../pics/office-main.jpg" alt="Office interior with cyberpunk lighting and workstations.">
    <div class="vignette" aria-hidden="true"></div>
    <div class="spot" aria-hidden="true"></div>

    <svg class="hotspots" viewBox="0 0 1376 768" preserveAspectRatio="xMidYMid slice" aria-label="Office hotspots">
      <a href="#" data-hotspot="os" aria-label="Open office screen">
        <rect x="700" y="350" width="360" height="280" rx="14" ry="14"></rect>
      </a>

      <a href="map.html" aria-label="Back to map">
        <rect x="230" y="230" width="100" height="100" rx="14" ry="14"></rect>
      </a>
    </svg>

    <a href="../index.html" target="_top" class="standalone-exit" aria-label="Exit to main site">Exit</a>
  </main>

  <div
    id="osOverlay"
    class="os-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Office screen"
    aria-hidden="true"
  >
    <div class="os-overlay__backdrop" data-close="true" aria-hidden="true"></div>
    <div class="os-overlay__panel" role="document">
      <div class="os-overlay__topbar">
        <div class="os-overlay__brand">
          <span class="os-overlay__brand__text">Decomposer</span>
        </div>
        <div class="os-overlay__actions">
          <button type="button" class="os-overlay__close" data-close="true" aria-label="Close overlay">✕</button>
        </div>
      </div>
      <div class="os-overlay__body">
        <section id="app-decompose" class="app" aria-label="decompose app">
          <div class="decompose">
            <p class="decompose__title">Let's work</p>
            <div class="decompose__view" id="decomposeView" aria-live="polite"></div>
          </div>
        </section>
      </div>
      <div class="os-overlay__footer">
        <div class="row">
          <button type="button" class="btn btn--ghost btn--small" id="decomposeWorkBtn">Work</button>
          <button type="button" class="btn btn--ghost btn--small" id="decomposeTasksBtn">Tasks</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('osOverlay');
      if (!overlay) return;

      function openOverlay() {
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('os-open');
        var closeBtn = overlay.querySelector('[data-close="true"]');
        if (closeBtn && typeof closeBtn.focus === 'function') closeBtn.focus();
      }
      function closeOverlay() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('os-open');
      }

      var closeBtnEl = overlay.querySelector('.os-overlay__close[data-close="true"]');
      var backdropEl = overlay.querySelector('.os-overlay__backdrop[data-close="true"]');
      var osHotspotLink = document.querySelector('[data-hotspot="os"]');
      if (osHotspotLink) {
        osHotspotLink.addEventListener('click', function (e) {
          e.preventDefault();
          openOverlay();
        });
      }
      if (closeBtnEl) {
        closeBtnEl.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeOverlay();
        });
      }

      overlay.addEventListener('click', function (e) {
        var t = e.target;
        if (backdropEl && t === backdropEl) return closeOverlay();
        if (t && t === overlay) return closeOverlay();
      });

      window.addEventListener('keydown', function (e) {
        if (!overlay || !overlay.classList.contains('is-open')) return;
        if (e.key === 'Escape') closeOverlay();
      });
    })();

    (function () {
      var LS_KEY = 'city.office.decompose.v1';
      var DEFAULT_MIN = 10;
      var DEFAULT_MS = DEFAULT_MIN * 60 * 1000;
      var MIN_ALLOWED = 1;
      var MAX_ALLOWED = 240;

      var viewEl = document.getElementById('decomposeView');
      var workBtn = document.getElementById('decomposeWorkBtn');
      var tasksBtn = document.getElementById('decomposeTasksBtn');
      if (!viewEl || !tasksBtn || !workBtn) return;

      var tickTimer = 0;

      function now() { return Date.now(); }
      function uid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
        return 'id_' + Math.random().toString(16).slice(2) + '_' + now().toString(16);
      }
      function safeParse(json, fallback) {
        try { return JSON.parse(json); } catch (e) { return fallback; }
      }
      function cleanLines(text) {
        return String(text || '').split('\n').map(function (s) {
          var line = String(s || '').trim();
          // Strip leading checklist marker like "☐ " or "✓ ".
          line = line.replace(/^[\u2610\u2611\u2713\u2714\u2715\u274C]\s+/, '');
          return line.trim();
        }).filter(Boolean);
      }
      function escapeHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function fmtDur(ms) {
        var s = Math.max(0, Math.round(ms / 1000));
        var m = Math.floor(s / 60);
        var r = s % 60;
        return String(m) + ':' + String(r).padStart(2, '0');
      }
      function parseMinutes(value) {
        var n = Number(String(value || '').replace(',', '.').trim());
        if (!Number.isFinite(n)) return null;
        n = Math.round(n);
        if (n < MIN_ALLOWED || n > MAX_ALLOWED) return null;
        return n;
      }
      function validateCustomMinutesInput() {
        var input = document.getElementById('customMinutesInput');
        var err = document.getElementById('customMinutesError');
        if (!input || !err) return null;
        var mins = parseMinutes(input.value);
        if (mins === null) {
          err.textContent = 'Enter a value from ' + MIN_ALLOWED + ' to ' + MAX_ALLOWED + ' minutes';
          input.focus();
          return null;
        }
        err.textContent = '';
        return mins;
      }

      function load() {
        var raw = localStorage.getItem(LS_KEY);
        var s = safeParse(raw, null);
        if (!s || typeof s !== 'object') {
          return { nodes: {}, children: {}, roots: [], workList: [], attempts: {}, spentMs: {}, completed: [], currentId: null, activeTimer: null, view: 'work', showCustomTimerInput: false };
        }
        s.nodes = s.nodes || {};
        s.children = s.children || {};
        s.roots = s.roots || [];
        s.workList = s.workList || [];
        s.attempts = s.attempts || {};
        s.spentMs = s.spentMs || {};
        s.completed = s.completed || [];
        if (!s.view) s.view = 'work';
        if (typeof s.showCustomTimerInput !== 'boolean') s.showCustomTimerInput = false;
        return s;
      }
      function save(state) { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
      function getNode(state, id) { return id ? state.nodes[id] : null; }
      function isCompleted(state, id) {
        for (var i = 0; i < state.completed.length; i++) if (state.completed[i].id === id) return true;
        return false;
      }
      function replaceInWorkList(state, targetId, replacementIds) {
        var idx = state.workList.indexOf(targetId);
        if (idx === -1) return;
        state.workList.splice.apply(state.workList, [idx, 1].concat(replacementIds));
      }
      function advanceIfCurrentDone(state) {
        while (state.workList.length && isCompleted(state, state.workList[0])) state.workList.shift();
        state.currentId = state.workList.length ? state.workList[0] : null;
      }
      function stopTick() {
        if (tickTimer) window.clearInterval(tickTimer);
        tickTimer = 0;
      }
      function ensureTick() {
        if (tickTimer) return;
        tickTimer = window.setInterval(function () {
          var state = load();
          if (state.view !== 'work' || !state.activeTimer) return;
          render(state);
        }, 250);
      }
      function startTimer(state, nodeId, attempt, durationMs) {
        var a = attempt || ((state.attempts[nodeId] || 0) + 1);
        var durMs = (typeof durationMs === 'number' && durationMs > 0) ? durationMs : DEFAULT_MS;
        state.activeTimer = { nodeId: nodeId, attempt: a, durationMs: durMs, endsAt: now() + durMs, startedAt: now() };
        state.showCustomTimerInput = false;
        save(state);
      }

      function renderWorkInput(state, opts) {
        var action = opts && opts.action ? opts.action : 'save-root';
        var btn = opts && opts.button ? opts.button : 'Save';
        var meta = opts && opts.meta ? opts.meta : '';
        var placeholder = opts && opts.placeholder ? opts.placeholder : 'One task per line';
        var initialValue = opts && typeof opts.value === 'string' ? opts.value : '';
        viewEl.innerHTML = ''
          + '<div class="decompose__card">'
          +   (meta ? '<p class="decompose__task">' + escapeHtml(meta) + '</p>' : '')
          +   '<div style="margin-top:0.65rem; text-align:left;">'
          +     '<textarea class="field__textarea" id="decomposeInput" placeholder="' + placeholder.replace(/"/g, '&quot;') + '"></textarea>'
          +     '<div class="row" style="justify-content:center; margin-top:0.65rem;">'
          +       '<button type="button" class="btn btn--primary" data-action="' + action + '">' + btn + '</button>'
          +     '</div>'
          +   '</div>'
          + '</div>';
        var ta = document.getElementById('decomposeInput');
        if (ta && initialValue) ta.value = initialValue;
        stopTick();
      }
      function renderWorkQuestion(state, node) {
        var customOpen = !!state.showCustomTimerInput;
        viewEl.innerHTML = ''
          + '<div class="decompose__card">'
          +   '<p class="decompose__prompt">Ready to do it in 10 minutes?</p>'
          +   '<p class="decompose__task decompose__task--focus">' + escapeHtml(node.text) + '</p>'
          +   '<div class="row" style="justify-content:center; margin-top:0.75rem;">'
          +     '<button type="button" class="btn btn--primary" data-action="yes-10">Yes</button>'
          +     '<button type="button" class="btn" data-action="show-custom">Custom</button>'
          +     '<button type="button" class="btn" data-action="decompose">Decompose</button>'
          +   '</div>'
          +   (customOpen
                ? ('<div class="row" style="justify-content:center; margin-top:0.55rem;">'
                  + '<input id="customMinutesInput" class="field__time" type="number" min="' + MIN_ALLOWED + '" max="' + MAX_ALLOWED + '" step="1" placeholder="min" aria-label="Time in minutes">'
                  + '<button type="button" class="btn" data-action="start-custom">Start custom timer</button>'
                  + '</div>'
                  + '<p id="customMinutesError" class="time-error" aria-live="polite"></p>')
                : '')
          + '</div>';
        stopTick();
      }
      function renderTimer(state, node, t) {
        var ms = Math.max(0, (t.endsAt || 0) - now());
        var totalSec = Math.ceil(ms / 1000);
        var mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
        var ss = String(totalSec % 60).padStart(2, '0');
        var attempt = (t.attempt || 1);
        viewEl.innerHTML = ''
          + '<div class="decompose__card">'
          +   '<p class="decompose__prompt">' + (attempt > 1 ? ('Attempt ' + attempt) : 'Timer') + '</p>'
          +   '<p class="decompose__task">' + escapeHtml(node.text) + '</p>'
          +   '<p class="decompose__timer">' + mm + ':' + ss + '</p>'
          +   '<div class="row" style="justify-content:center; margin-top:0.75rem;">'
          +     '<button type="button" class="btn btn--primary" data-action="timer-done">Done</button>'
          +   '</div>'
          + '</div>';
        if (ms <= 0) {
          stopTick();
          state.activeTimer = { nodeId: t.nodeId, attempt: t.attempt, durationMs: t.durationMs, endsAt: t.endsAt, startedAt: t.startedAt, finished: true };
          save(state);
          render(state);
          return;
        }
        ensureTick();
      }
      function renderDonePrompt(state, node, attempt) {
        viewEl.innerHTML = ''
          + '<div class="decompose__card">'
          +   '<p class="decompose__prompt">Done?</p>'
          +   '<p class="decompose__task">' + escapeHtml(node.text) + '</p>'
          +   '<div class="row" style="justify-content:center; margin-top:0.75rem;">'
          +     '<button type="button" class="btn btn--primary" data-action="done-yes">Yes</button>'
          +     '<button type="button" class="btn" data-action="done-no">No</button>'
          +   '</div>'
          +   '<p class="decompose__meta">Attempts: ' + attempt + '</p>'
          + '</div>';
        stopTick();
      }
      function buildCurrentList(state) {
        var out = [];
        for (var i = 0; i < state.workList.length; i++) {
          var id = state.workList[i];
          if (isCompleted(state, id)) continue;
          var n = getNode(state, id);
          if (!n) continue;
          var prefix = (i === 0 ? '<span style="color:rgb(var(--accent-rgb) / 0.95)">•</span> ' : '');
          out.push(prefix + escapeHtml(n.text));
        }
        return out;
      }
      function renderTasks(state) {
        var currentItems = buildCurrentList(state);
        var doneItems = (state.completed || []).slice().reverse();
        var currentHtml = currentItems.length
          ? ('<ul class="decompose__ul">' + currentItems.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>')
          : '<p class="decompose__meta">—</p>';
        var doneHtml = doneItems.length
          ? ('<ul class="decompose__ul">' + doneItems.map(function (x) {
              var a = (x.attempts || 1);
              var t = (typeof x.durationMs === 'number' && x.durationMs !== null) ? (' · ' + fmtDur(x.durationMs)) : '';
              return '<li>' + escapeHtml(x.text) + ' <span style="color:rgba(232,238,246,0.55)">(' + a + t + ')</span></li>';
            }).join('') + '</ul>')
          : '<p class="decompose__meta">—</p>';
        viewEl.innerHTML = ''
          + '<div class="decompose__card">'
          +   '<div class="decompose__lists">'
          +     '<div><p class="decompose__h">Current</p>' + currentHtml + '</div>'
          +     '<div><p class="decompose__h">Done</p>' + doneHtml + '</div>'
          +   '</div>'
          +   '<div class="row" style="justify-content:center; margin-top:0.85rem;">'
          +     '<button type="button" class="btn" data-action="edit-tasks">Edit</button>'
          +     '<button type="button" class="btn" data-action="reset">Reset</button>'
          +   '</div>'
          + '</div>';
        stopTick();
      }
      function renderEditTasks(state) {
        var current = buildCurrentListPlain(state);
        renderWorkInput(state, {
          action: 'save-edited-tasks',
          button: 'Save list',
          placeholder: 'One task per line',
          meta: 'Edit current task list',
          value: current.join('\n')
        });
      }
      function resetAll() {
        localStorage.removeItem(LS_KEY);
        stopTick();
        render(load());
      }
      function onSaveRoot(state, text) {
        var lines = cleanLines(text);
        if (!lines.length) return;
        var ids = lines.map(function (t) {
          var id = uid();
          state.nodes[id] = { id: id, text: t, parentId: null, level: 1, createdAt: now() };
          state.roots.push(id);
          return id;
        });
        if (!state.workList.length) state.workList = ids.slice();
        else state.workList = state.workList.concat(ids);
        state.currentId = state.workList[0] || null;
        save(state);
      }
      function onBreakDown(state, parentId, text) {
        var parent = getNode(state, parentId);
        if (!parent) return;
        var lines = cleanLines(text);
        if (!lines.length) return;
        var lvl = Math.min(99, (parent.level || 1) + 1);
        var parentText = String(parent.text || '').trim();
        var ids = lines.map(function (t) {
          var id = uid();
          var childText = String(t || '').trim();
          var composedText = parentText ? (parentText + ': ' + childText) : childText;
          state.nodes[id] = { id: id, text: composedText, parentId: parentId, level: lvl, createdAt: now() };
          return id;
        });
        state.children[parentId] = ids;
        replaceInWorkList(state, parentId, ids);
        state.currentId = state.workList[0] || null;
        save(state);
      }
      function markDone(state, nodeId, attempt, durationMs) {
        var node = getNode(state, nodeId);
        if (!node) return;
        var finalAttempts = attempt || state.attempts[nodeId] || 1;
        state.completed.push({
          id: nodeId,
          text: node.text,
          attempts: finalAttempts,
          durationMs: (typeof durationMs === 'number') ? durationMs : null,
          completedAt: now(),
          level: node.level || 1,
          parentId: node.parentId || null
        });
        state.attempts[nodeId] = finalAttempts;
        if (state.spentMs && typeof state.spentMs === 'object') delete state.spentMs[nodeId];
        var idx = state.workList.indexOf(nodeId);
        if (idx !== -1) state.workList.splice(idx, 1);
        state.currentId = state.workList[0] || null;
        state.activeTimer = null;
        save(state);
      }
      function buildCurrentListPlain(state) {
        var out = [];
        for (var i = 0; i < state.workList.length; i++) {
          var id = state.workList[i];
          if (isCompleted(state, id)) continue;
          var n = getNode(state, id);
          if (!n || !n.text) continue;
          out.push(String(n.text));
        }
        return out;
      }
      function replaceCurrentWorkListFromText(state, text) {
        var lines = cleanLines(text);
        state.workList = [];
        state.currentId = null;
        state.activeTimer = null;
        state.pendingBreakdownFor = null;
        if (!lines.length) {
          save(state);
          return;
        }
        var ids = lines.map(function (t) {
          var id = uid();
          state.nodes[id] = { id: id, text: t, parentId: null, level: 1, createdAt: now() };
          return id;
        });
        state.workList = ids;
        state.currentId = ids[0] || null;
        save(state);
      }
      function render(state) {
        if (state.view === 'tasks') return renderTasks(state);
        advanceIfCurrentDone(state);
        save(state);
        if (state.activeTimer && state.activeTimer.nodeId) {
          var t = state.activeTimer;
          var node = getNode(state, t.nodeId);
          if (!node) {
            state.activeTimer = null;
            save(state);
            return render(state);
          }
          if (t.finished || (t.endsAt && now() >= t.endsAt)) return renderDonePrompt(state, node, t.attempt || 1);
          return renderTimer(state, node, t);
        }
        if (!state.workList.length) return renderWorkInput(state, { placeholder: 'One task per line', action: 'save-root', button: 'Save' });
        var currentId = state.workList[0];
        var current = getNode(state, currentId);
        if (!current) {
          state.workList.shift();
          state.currentId = state.workList[0] || null;
          save(state);
          return render(state);
        }
        state.currentId = currentId;
        save(state);
        renderWorkQuestion(state, current);
      }

      viewEl.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest ? e.target.closest('[data-action]') : null;
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var state = load();

        if (action === 'save-root') {
          var ta0 = document.getElementById('decomposeInput');
          onSaveRoot(state, ta0 ? ta0.value : '');
          return render(load());
        }
        if (action === 'yes-10') {
          advanceIfCurrentDone(state);
          var id = state.workList[0];
          if (id) startTimer(state, id, null, DEFAULT_MS);
          return render(load());
        }
        if (action === 'show-custom') {
          state.showCustomTimerInput = true;
          save(state);
          return render(load());
        }
        if (action === 'start-custom') {
          advanceIfCurrentDone(state);
          var idCustom = state.workList[0];
          if (!idCustom) return render(load());
          var mins = validateCustomMinutesInput();
          if (mins === null) return;
          startTimer(state, idCustom, null, mins * 60 * 1000);
          return render(load());
        }
        if (action === 'decompose') {
          advanceIfCurrentDone(state);
          var id2 = state.workList[0];
          var node2 = getNode(state, id2);
          if (!node2) return render(load());
          state.showCustomTimerInput = false;
          renderWorkInput(state, { placeholder: 'One subtask per line', action: 'save-breakdown', button: 'Save', meta: node2.text });
          state.pendingBreakdownFor = id2;
          save(state);
          return;
        }
        if (action === 'save-breakdown') {
          var parentId = state.pendingBreakdownFor;
          var ta = document.getElementById('decomposeInput');
          onBreakDown(state, parentId, ta ? ta.value : '');
          state.pendingBreakdownFor = null;
          save(state);
          return render(load());
        }
        if (action === 'edit-tasks') {
          return renderEditTasks(state);
        }
        if (action === 'save-edited-tasks') {
          var taEdit = document.getElementById('decomposeInput');
          replaceCurrentWorkListFromText(state, taEdit ? taEdit.value : '');
          return render(load());
        }
        if (action === 'done-yes') {
          var t = state.activeTimer;
          if (t && t.nodeId) {
            var prev = state.spentMs && typeof state.spentMs[t.nodeId] === 'number' ? state.spentMs[t.nodeId] : 0;
            var addMs = (typeof t.durationMs === 'number' && t.durationMs > 0) ? t.durationMs : DEFAULT_MS;
            markDone(state, t.nodeId, t.attempt || 1, prev + addMs);
          }
          return render(load());
        }
        if (action === 'timer-done') {
          var t0 = state.activeTimer;
          if (t0 && t0.nodeId) {
            var startedAt = (typeof t0.startedAt === 'number') ? t0.startedAt : now();
            var dur = Math.max(0, now() - startedAt);
            var prev0 = state.spentMs && typeof state.spentMs[t0.nodeId] === 'number' ? state.spentMs[t0.nodeId] : 0;
            markDone(state, t0.nodeId, t0.attempt || 1, prev0 + dur);
          }
          return render(load());
        }
        if (action === 'done-no') {
          var t2 = state.activeTimer;
          if (t2 && t2.nodeId) {
            if (state.spentMs) {
              var add = (typeof t2.durationMs === 'number' && t2.durationMs > 0) ? t2.durationMs : DEFAULT_MS;
              state.spentMs[t2.nodeId] = (typeof state.spentMs[t2.nodeId] === 'number' ? state.spentMs[t2.nodeId] : 0) + add;
            }
            var nextAttempt = (t2.attempt || 1) + 1;
            var nextDuration = (typeof t2.durationMs === 'number' && t2.durationMs > 0) ? t2.durationMs : DEFAULT_MS;
            state.activeTimer = null;
            save(state);
            var s2 = load();
            startTimer(s2, t2.nodeId, nextAttempt, nextDuration);
          }
          return render(load());
        }
        if (action === 'reset') return resetAll();
      });

      viewEl.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        if (e.target && e.target.id === 'customMinutesInput') {
          e.preventDefault();
          var btn = viewEl.querySelector('[data-action="start-custom"]');
          if (btn) btn.click();
        }
      });

      workBtn.addEventListener('click', function () {
        var state = load();
        state.view = 'work';
        save(state);
        render(load());
      });
      tasksBtn.addEventListener('click', function () {
        var state = load();
        state.view = 'tasks';
        save(state);
        render(load());
      });

      render(load());
    })();
  </script>
  <script src="../js/scene-common.js"></script>
  <script src="../js/gesture-bridge.js"></script>
</body>
</html>
